<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Wikidataを用いた検索システム【詳細表示】</title>

    <link rel="stylesheet" href="style.css" />
    <!-- KG検索用のライブラリ読み込み -->
    <script src="KGSearch.js"></script>
    <!-- sameAsでのリダイレクトに対応するために、福田が追加したところ start-->
    <script src="./detailedContents.js"></script>
    <script>
      const resolveWikidataId = async (qid) => {
        const endpointUrl = 'https://query.wikidata.org/sparql';
        const query = `
          SELECT ?s WHERE {
            BIND(${qid} as ?input)
            OPTIONAL{
              ?input owl:sameAs/owl:sameAs* ?transfer .
              FILTER(REGEX(STR(?transfer), "^http://www.wikidata.org/entity/")) #sameAsを、WikidataのEntityのみに絞り込む
            }
            # transferに値が束縛されている(sameAsがある)場合はtransferを、そうでない場合はinputを?sに束縛する
            BIND(IF(bound(?transfer), ?transfer, ?input) as ?s)
          }LIMIT 1
        `;
        const resultJson = await sendQuery(endpointUrl, query);
        const result = await resultJson.json();
        /* 上記のクエリは、sameAsがない場合は入力したIDを返す
          そのため、ネットワークエラーやjsonの解釈でエラーがでない限りは値があると考えてよい */
        const resultIri = result['results']['bindings'][0]['s']['value'];

        return resultIri.replace('http://www.wikidata.org/entity/', 'wd:');
      };
      /* dataをProptyでまとめる */
      const bundleDataWithProperty = (data) => {
        const propList = Array.from(
          new Map(data.map((x) => [x['p']['value'], x['propLabel']?.['value']]))
        );
        // console.log(propList);
        /* dataObjectの要素例
                "http://www.wikidata.org/prop/direct/P856": {
                  "iri": "http://www.wikidata.org/prop/direct/P856"
                  "label": "公式ウェブサイト",
                  "objs": [
                      {
                          "o": {
                              "type": "uri",
                              "value": "https://www.city.neyagawa.osaka.jp/"
                          },
                          "oLabel": {
                              "type": "literal",
                              "value": "https://www.city.neyagawa.osaka.jp/"
                          }
                      },
                      {
                          "o": {
                              "type": "uri",
                              "value": "https://www.city.neyagawa.osaka.jp/roma2/"
                          },
                          "oLabel": {
                              "type": "literal",
                              "value": "https://www.city.neyagawa.osaka.jp/roma2/"
                          }
                      },
                      {
                          "o": {
                              "type": "uri",
                              "value": "https://www.city.neyagawa.osaka.jp/yasashiinihongo/"
                          },
                          "oLabel": {
                              "type": "literal",
                              "value": "https://www.city.neyagawa.osaka.jp/yasashiinihongo/"
                          }
                      }
                  ]
                },
              */
        return new Map(
          propList.map(([propIri, propLabel]) => [
            propIri,
            new Map([
              ['iri', propIri],
              ['label', propLabel],
              [
                'objs',
                data
                  .filter((x) => x['p']['value'] === propIri)
                  .map((x) => {
                    const { o, oLabel } = x;
                    return Object.entries({ o, oLabel }).reduce(
                      (l, [k, v]) => l.set(k, v),
                      new Map()
                    );
                  }),
              ],
            ]),
          ])
        );
      };

      function showResultDetailsFukuda(resultData, resultArea, props, inputId) {
        /* 初期化 */
        resultArea.textContent = '';
        const fragment = new DocumentFragment();
        //表示するプロパティの順番を設定
        /* propsの長さを取得する。
          オプショナルチェーン(?.)によって、propsがnullならundefinedが返る。
          Null合体演算子(??)によって、左がnullまたはundifinedの場合のみ、右の値が代入される。
        */
        const propLen = props?.length ?? 0;
        const data = resultData.results.bindings;
        const len = data.length;

        if (len == 0) {
          resultArea.innerHTML = '検索結果なし';
          return;
        }

        /* output example
          rowprop = ['wdt:P1', 'wdt:P2', 'wdt:P3', 'wdt:P3', 'wdt:P3']
          rownum = [1, 1, 3, 0, 0]
        */
        const rowprop = data.map((x) => x['p'].value);
        const rownum = ((props) => {
          const seen = new Set();
          return props.map((element) => {
            if (seen.has(element)) {
              return 0;
            } else {
              seen.add(element);
              return props.filter((e) => e === element).length;
            }
          });
        })(rowprop);

        //見出し語部分
        if (data[0]['item'] != null) {
          const itemLabel = data[0]['itemLabel'].value;
          const convertedItemIri2Https = data[0]['item'].value.replace(
            'http://',
            'https://'
          );
          const itemId = data[0]['item'].value.replace(
            'http://www.wikidata.org/entity/',
            ''
          );
          const headerHtml = `<h2 class="details-title">${itemLabel}<br><p class='wikidata-id'>（Wikidata ID:<a href="${convertedItemIri2Https}" target="_blank">${itemId}</a>）${
            inputId.replace('wd:', '') != itemId
              ? `（Wikidata ID:<a href="${inputId.replace(
                  'wd:',
                  'http://www.wikidata.org/entity/'
                )}" target="_blank">${inputId.replace('wd:', '')}</a>から転送）`
              : ''
          }</p></h2>`;
          const htmlToDom = (htmlString) => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');
            return doc.body.firstElementChild;
          };
          fragment.append(htmlToDom(headerHtml));
        }

        /* propLabelがとれなかったものを追加するための関数 */
        const addPropLabelForBundleData = (bundledData, propLabelsMap) =>
          Array.from(propLabelsMap).reduce((acc, [iri, label]) => {
            if (acc.has(iri)) {
              acc.get(iri).set('label', label);
            }
            return acc;
          }, structuredClone(bundledData));

        const extractFromMap = (map) => (keysToExtract) => {
          const extracted = new Map();
          const remaining = new Map(map);

          // 配列でない場合は配列に変換
          const keys = Array.isArray(keysToExtract)
            ? keysToExtract
            : [keysToExtract];

          keys.forEach((key) => {
            if (remaining.has(key)) {
              extracted.set(key, remaining.get(key));
              remaining.delete(key);
            }
          });

          return new Map([
            ['extracted', extracted],
            ['remaining', remaining],
          ]);
        };

        // 名前・別名・説明のことを、ここではまとめてlexicalDataと呼称
        const lexicalPropsLabel = new Map([
          ['http://www.w3.org/2000/01/rdf-schema#label', '名前'],
          ['http://www.w3.org/2004/02/skos/core#altLabel', '別名'],
          ['http://schema.org/description', '説明'],
        ]);
        const bundledData = addPropLabelForBundleData(
          bundleDataWithProperty(data),
          lexicalPropsLabel
        );
        // console.log(bundledData);

        // lexicalDataのTabelを生成
        const lexicalPropIriList = Array.from(lexicalPropsLabel).map(
          ([key]) => key
        );
        // console.log(Array.from(bundledData));
        const lexicalDataTable = detailedContents(
          createTable,
          extractFromMap(bundledData)(lexicalPropIriList).get('extracted')
        );

        // console.log(lexicalDataTable);

        // 上位クラス・分類のTableを生成
        const classProps = [
          'http://www.wikidata.org/prop/direct/P31',
          'http://www.wikidata.org/prop/direct/P279',
        ];
        // 上位クラス・分類のTabelを生成
        const bundledDataFilterdClassProps = new Map(
          Array.from(bundledData).filter(([key, value]) =>
            classProps.includes(key)
          )
        );
        const classPropsTable = detailedContents(
          createTable,
          bundledDataFilterdClassProps
        );

        const hogeList = [lexicalPropIriList, classProps];
        const hogeReduceingRes = hogeList.reduce(
          ([bundledData, tables], cur) => {
            const hoge = extractFromMap(bundledData)(cur);
            tables.push(detailedContents(createTable, hoge.get('extracted')));
            return [hoge.get('remaining'), tables];
          },
          [structuredClone(bundledData), []]
        );

        const elseTable = detailedContents(createTable, hogeReduceingRes[0]);
        const result = hogeReduceingRes[1]
          .concat([elseTable])
          .reduce(
            (acc, curr, index) =>
              index === 0
                ? [curr]
                : [...acc, document.createElement('hr'), curr],
            []
          );

        fragment.append(...result);
        resultArea.append(fragment);
      }

      async function main() {
        const qidOrLabel = document.getElementById('QID').value;
        const queryTemplate = document.getElementById('query_area').value;
        /*
          qid以外の場合は、qidに変換してから格納する
          ただし、検索した結果が0の場合は、空文字を格納する
          wd:Qから始まる場合は、wikidataEntityのためそのまま
        */
        const qid = qidOrLabel.startsWith('wd:Q')
          ? qidOrLabel
          : 'wd:' +
            (await (async (label) =>
              //	labelからIDの配列を受け取り、要素がある場合は頭の値、ない場合は空文字を返す即時関数
              await getWdIDse(label).then((res) =>
                res.length > 0 ? res[0] : ''
              ))(qidOrLabel));
        //空文字の場合は終了
        if (qid === '') {
          //終了時の処理
          alert('「QID」または「ラベル」を入力して下さい');
          return;
        }
        /*
          Wikidata上で、ほかのEntityに統合されていないかを確認し、統合されている場合は統合先のIDに変更する。
          Wikidata内では、owl:sameAsがリダイレクトに用いられている。
          そのため、owl:sameAsがWikidataEntityに繋がっている主語については、目的語のIDに置換するのが妥当である。
        */
        const verifiedQId = await resolveWikidataId(qid);
        const query = queryTemplate.replace('?QID', verifiedQId);
        /* 確認用output */
        document.getElementById('query_area2').value = query;
        /* 指定されたEntityについての情報を取得 */
        const endpoint = 'https://query.wikidata.org/sparql';
        const resultData = await sendSPARQLQuery(endpoint, query);
        /* 結果のjsonを整形して出力 */
        document.getElementById('resjson_area').value = JSON.stringify(
          resultData,
          null,
          2
        );
        const resultArea = document.getElementById('result_div');

        showResultDetailsFukuda(resultData, resultArea, props, qid);
      }
    </script>
    <!-- sameAsでのリダイレクトに対応するために、福田が追加したところ end-->
    <script>
      //詳細表示ページ用の設定
      const keylink = 'item'; //リンクのkeyとする変数
      const detail_html = 'details.html'; //詳細表示用のHTMLファイル

      //表示するプロパティの順番(必要に応じて変更する)
      const props = [];
      //const props = ["wdt:P17","wdt:P18"];  //記載例

      window.addEventListener(
        'load',
        async () => {
          const sendButton = document.getElementById('send');

          //検索実行ボタンの処理
          sendButton.addEventListener(
            'click',
            async () => {
              main();
            },
            false
          );

          //パラメータ(?key=XXXX)を使ったアクセスの処理
          var param = location.search;
          if (param != '') {
            document.getElementById('QID').value = decodeURI(
              param.replace('?key=', '')
            );
            document.getElementById('head').style.display = 'none';
            document.getElementById('menu').style.display = 'none';
            main();
          }
        },
        false
      );

      //検索に用いるSPARQLクエリを生成し，実行する
      async function makeQuery() {
        const endpoint = 'https://query.wikidata.org/sparql';
        const resultArea = document.getElementById('result_div');
        let query = document.getElementById('query_area').value;

        const textQID = document.getElementById('QID').value;
        if (textQID != '') {
          if (textQID.startsWith('wd:Q')) {
            query = query.replace('?QID', textQID);
          } else {
            let qid = await getWdIDse(textQID); //getWdIDも使用可能
            query = query.replace('?QID', 'wd:' + qid);
          }
          document.getElementById('query_area2').value = query;
        } else {
          alert('「QID」または「ラベル」を入力して下さい');
        }

        //SPARQLクエリの実行
        resultArea.innerHTML = '';
        document.getElementById('result_box').style.display = 'flex';
        showSearchIng(resultArea);

        const resultData = await sendSPARQLQuery(endpoint, query);

        document.getElementById('resjson_area').value = JSON.stringify(
          resultData,
          null,
          '  '
        );

        showResultDetailsFukuda(resultData, resultArea, props); //クエリ結果の表示【詳細表示用】
      }
    </script>
  </head>

  <body>
    <header id="head">
      <h1>Wikidataを用いた検索システム【詳細表示】</h1>
    </header>

    <!-- 検索条件設定の領域 -->
    <div id="menu" class="container">
      <div style="margin-top: 4px">
        <!-- 検索条件を設定するには下記のコメントを外す  -->
        Wikidata ID（例：wd:Q7105556），または，ラベルで検索<br />
        <input
          id="QID"
          type="text"
          value="wd:Q389633"
          autocomplete="off"
          size="20"
        />
        <input
          type="button"
          id="send"
          value="検索の実行"
          style="margin-top: 8px"
        /><br />
        <hr />
        <!-- 下記の「クエリの表示・非表示」ボタンは，必要がなければコメントアウトしてもよい  -->
        <input
          type="button"
          id="dis_b"
          value="クエリの表示"
          onclick="document.getElementById('query').style.display = 'block';
			document.getElementById('dis_b').style.display = 'none';
			document.getElementById('none_b').style.display = 'block';"
        />
        <input
          type="button"
          id="none_b"
          value="クエリの非表示"
          style="display: none"
          onclick="document.getElementById('query').style.display = 'none';
			document.getElementById('dis_b').style.display = 'block';
			document.getElementById('none_b').style.display = 'none';"
        />
      </div>

      <div id="query" style="display: none">
        <b>置き換え前のクエリ</b>：<br />
        <!--注：こちらのクエリは【修正しない！】-->
        <textarea id="query_area" class="t_area" rows="10">
select DISTINCT ?item ?itemLabel ?o ?oLabel ?p ?prop ?propLabel
where{
    BIND(?QID AS ?item)
    ?item ?p ?o.
    FILTER(
    	(isLiteral(?o)&&((lang(?o)="ja")||(lang(?o)="")))
    		||(!isLiteral(?o)
	    &&(!contains(str(?o),"http://www.wikidata.org/entity/statement/"))
		)
    )
	OPTIONAL{?prop wikibase:directClaim ?p.}
    SERVICE wikibase:label { bd:serviceParam wikibase:language "ja,en". }
}ORDER BY ?p	
</textarea
        >
        <br />
        <b>置き換え後のクエリ</b>：
        <input
          type="button"
          value="WikidataでSPARQL検索"
          onclick="openSPARQLendpoint('https://query.wikidata.org#',document.getElementById('query_area2').value)"
        /><br />
        <textarea id="query_area2" class="t_area" rows="10"></textarea><br />
        <b>クエリ実行結果の戻り値(JSON形式）</b>：<br />
        <textarea id="resjson_area" class="t_area" rows="10"></textarea>
      </div>
    </div>
    <!-- 結果表示用の領域 -->
    <div id="result_box" style="">
      <div id="result_div" class="container" style="flex: 1"></div>
    </div>
    <hr />
  </body>
</html>
